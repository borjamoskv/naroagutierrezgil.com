<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>NAROA — Capítulos · Retratos hiperrealistas POP</title>
  <meta name="description" content="Experiencia scroll por capítulos: diez retratos hiperrealistas POP de Naroa Gutiérrez Gil, Bilbao.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,600&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./capitulos.css">
</head>
<body>

  <!-- UI mínima: barra de progreso + contador -->
  <div class="progress" aria-hidden="true"><span id="progress-bar"></span></div>
  <p class="counter" id="counter" aria-hidden="true">00 / 10</p>

  <main id="experience">

    <!-- Capítulo 0 · Portada -->
    <section class="cover" id="portada">
      <div class="cover__inner">
        <p class="cover__kicker">Naroa Gutiérrez Gil · Bilbao</p>
        <h1 class="cover__title">NAROA</h1>
        <p class="cover__sub">Capítulos — diez retratos hiperrealistas POP</p>
        <p class="cover__hint" aria-hidden="true">
          <span>Desliza para empezar</span>
          <i class="cover__line"></i>
        </p>
      </div>
    </section>

    <!-- Los 10 capítulos se montan aquí desde manifest.json + capitulos-copy.json -->
    <div id="chapters"></div>

    <!-- Cierre -->
    <section class="outro" id="cierre">
      <div class="outro__inner">
        <p class="outro__kicker">Fin del recorrido</p>
        <h2 class="outro__title">Gracias por mirar.</h2>
        <p class="outro__body">Naroa Gutiérrez Gil — retratos hiperrealistas POP · Bilbao</p>
        <a class="outro__link" href="https://naroa.online" rel="noopener">naroa.online</a>
        <p class="outro__credit">Obras e imágenes © Naroa Gutiérrez Gil · Una experiencia scroll</p>
      </div>
    </section>

  </main>

  <noscript>
    <p style="padding:2rem;font-family:sans-serif;color:#f5efe8;background:#0d0b0b;">
      Esta experiencia necesita JavaScript para mostrarse. Visita <a href="https://naroa.online" style="color:#d8a24a;">naroa.online</a>.
    </p>
  </noscript>

  <!-- Orden de carga: gsap → ScrollTrigger → lenis → script propio (NOTES.md §1.1) -->
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/ScrollTrigger.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/lenis@1.3.25/dist/lenis.min.js"></script>
  <script src="./capitulos.js"></script>
</body>
</html>
